<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js transparency reproduction</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { display: grid; place-items: center; background: #00ff7f; }
      body[data-background="transparent"] {
        background-color: #fff;
        background-image: conic-gradient(#cbd5e1 25%, transparent 0 50%, #cbd5e1 0 75%, transparent 0);
        background-size: 32px 32px;
      }
      canvas { display: block; width: 320px; height: 320px; }
    </style>
  </head>
  <body>
    <canvas id="fixture" width="320" height="320" aria-label="Three.js transparency fixture"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
