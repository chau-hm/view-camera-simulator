<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Background -->
  <rect width="320" height="180" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1"/>

  <!-- Ground plane -->
  <line x1="20" y1="120" x2="300" y2="120" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="2 4"/>

  <!-- Cube subject (centered) -->
  <rect x="140" y="60" width="60" height="60" fill="#6366f1" opacity="0.8" rx="2"/>
  <rect x="140" y="60" width="60" height="60" fill="none" stroke="#4f46e5" stroke-width="1.5" rx="2"/>

  <!-- Original ghost camera (dashed, left) -->
  <g opacity="0.4">
    <!-- Rear standard -->
    <rect x="55" y="50" width="8" height="50" fill="#94a3b8" rx="1"/>
    <!-- Front standard -->
    <rect x="85" y="55" width="8" height="40" fill="#94a3b8" rx="1"/>
    <!-- Bellows -->
    <line x1="63" y1="75" x2="85" y2="75" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Lens -->
    <rect x="93" y="68" width="6" height="14" fill="#cbd5e1" rx="1"/>
  </g>

  <!-- Current camera (solid, right) -->
  <g>
    <!-- Rear standard (raised) -->
    <rect x="210" y="30" width="8" height="50" fill="#4b5563" rx="1"/>
    <!-- Front standard -->
    <rect x="240" y="55" width="8" height="40" fill="#6b7280" rx="1"/>
    <!-- Bellows -->
    <line x1="218" y1="55" x2="240" y2="75" stroke="#374151" stroke-width="1.5"/>
    <!-- Lens -->
    <rect x="248" y="68" width="6" height="14" fill="#1f2937" rx="1"/>
  </g>

  <!-- Movement arrow -->
  <line x1="150" y1="20" x2="150" y2="55" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Label -->
  <text x="160" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Original vs Current</text>
  <text x="160" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Camera movements comparison</text>
</svg>
