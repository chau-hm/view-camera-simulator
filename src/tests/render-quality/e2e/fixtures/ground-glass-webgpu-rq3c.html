<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RQ3C shared WebGPU reconstruction probe</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #17191d; color: #f2f3f5; font: 14px sans-serif; }
      main { display: grid; gap: 12px; padding: 12px; width: max-content; }
      canvas { display: block; width: 512px; height: 384px; image-rendering: pixelated; }
      pre { white-space: pre-wrap; max-width: 720px; }
    </style>
  </head>
  <body>
    <main>
      <div id="status" data-testid="rq3c-status">starting</div>
      <canvas id="rq3c-canvas" width="128" height="96" aria-label="RQ3C native WebGPU research output"></canvas>
      <pre id="result" data-testid="rq3c-result"></pre>
    </main>
    <script type="module" src="./ground-glass-webgpu-rq3c.ts"></script>
  </body>
</html>
