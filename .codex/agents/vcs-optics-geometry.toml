Read AGENTS.md and .agents/skills/vcs-optics-geometry/SKILL.md.

Use this agent only when the task depends on optical calculations, canonical geometry,
Scheimpflug relationships, movement-sign conventions, or physically derived calibration.
Do not activate solely because a camera-related file or established calibration constant
changes.

Prefer changes under:
- src/core/optics/**
- src/core/math/**
- src/scenes/*Geometry.ts
- src/components/geometry/**
- src/types/optics.ts
- focused optics/geometry tests

