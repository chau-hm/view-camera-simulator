name: CI and Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # M7E native captures name a source commit from PR #303. That PR was
      # squash-merged, so fetch its retained head ref for strict source checks.
      - name: Fetch M7E native capture source history
        run: git fetch --no-tags --depth=50 origin refs/pull/303/head

      # M7F native captures name a source commit from PR #304. That PR was
      # squash-merged, so the capture commit is not reachable from main; fetch
      # its retained head ref so strict source-commit verification can inspect it.
      - name: Fetch M7F native capture source history
        run: git fetch --no-tags --depth=50 origin refs/pull/304/head

      # M7J records a candidate capture from PR #308. The PR may be squash-merged,
      # leaving its original capture commit outside main's history. Keep strict
      # provenance checks by fetching the retained PR head and verifying that SHA.
      - name: Fetch M7J retained capture source history
        run: |
          git fetch --no-tags --depth=50 origin refs/pull/308/head
          git cat-file -e '17a2616b151aa50ad34b2d137eee0a43c5759ad3^{commit}'

      # Fetch the exact M7K baseline commit. If the remote does not permit a
      # direct SHA fetch, the helper unshallows main and verifies the same SHA.
      - name: Fetch M7K execution source history
        run: node scripts/fetch-m7k-execution-source.mjs --sha=e6066a244510387c32995c1e973a771667b04d10

      # M7M selected captures were run against this exact main commit below.
      # Keep that source and the full Playwright discovery/test tree available.
      - name: Fetch M7M scene-readiness execution source history
        run: >-
          node scripts/fetch-m7k-execution-source.mjs
          --sha=0c32f113c1e3d16a8fd42e7748c64909366c6ae8
          --verify-path=playwright.config.ts

      # The retained normalizer and original M7M evaluator were introduced in
      # PR #311. Keep their exact source revision retrievable after squash merge.
      - name: Fetch M7M retained normalizer and evaluator source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=e6c139ef60974a544f75a45d062b92101d31d115 \
            --retained-ref=refs/pull/311/head \
            --verify-path=scripts/normalize-m7m-playwright-capture.mjs \
            --verify-path=src/render/testing/groundGlassM7mSceneReadiness.ts \
            --verify-path=scripts/evaluateM7mSceneReadiness.ts \
            --verify-path=scripts/run-m7m-scene-readiness.mjs
          git update-ref refs/m7m/retained-tooling e6c139ef60974a544f75a45d062b92101d31d115
          git cat-file -e 'e6c139ef60974a544f75a45d062b92101d31d115^{commit}'

      # M7N retains application execution, capture tooling, normalization, and
      # evaluation at distinct PR commits. Retrieve each pinned source from the
      # retained M7N head so the offline evidence check remains valid after a
      # squash merge removes those commits from main's reachable history.
      - name: Fetch M7N renderer lifecycle evidence source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=5034edf1551466649623a920024057b57f8dddbf \
            --retained-ref=refs/pull/312/head \
            --verify-path=src/app/pages.tsx \
            --verify-path=src/components/layout/SimulatorWorkspace.tsx \
            --verify-path=src/components/simulator/SceneViewport.tsx \
            --verify-path=src/components/simulator/useObserverRendererLifecycle.ts \
            --verify-path=src/render/GroundGlassRenderHost.tsx \
            --verify-path=src/render/SceneRenderer.tsx \
            --verify-path=src/render/testing/m7nRendererLifecycleTrace.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=3ec85599c3cd28019126ce00cff6115c1bcdf059 \
            --retained-ref=refs/pull/312/head \
            --verify-path=src/tests/e2e/helpers/m7nRendererLifecycleCapture.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/architecture-rise-webgpu-production.spec.ts \
            --verify-path=scripts/m7n-spa-generation-probe.mjs \
            --verify-path=package.json \
            --verify-path=src/tests/unit/m7nRendererLifecycleTrace.test.ts \
            --verify-path=src/tests/unit/m7nRendererLifecycleEvidence.test.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=a5fbc9e6b7db00ce818edfaebeeb5ce4ab79da07 \
            --retained-ref=refs/pull/312/head \
            --verify-path=src/tests/e2e/helpers/m7nRendererLifecycleCapture.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=efdd29ddcea206b07a2dbd197ff813ccfb2479b1 \
            --retained-ref=refs/pull/312/head \
            --verify-path=scripts/normalizeM7nRendererLifecycleCapture.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=ef79ee9886dacc0a1402fd9271318564e7ccfae6 \
            --retained-ref=refs/pull/312/head \
            --verify-path=scripts/evaluateM7nRendererLifecycle.ts \
            --verify-path=scripts/run-m7n-renderer-lifecycle.mjs

      # M7O's capture, matrix normalizer, and evaluator use separate pinned
      # commits. Retain each exact source through this PR head so evidence
      # provenance remains checkable after a future squash merge.
      - name: Fetch M7O Canvas assertion timing evidence source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=e5150fdaa6d9660c99ac3c36086cfaa1439e4bcb \
            --retained-ref=refs/pull/313/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/components/simulator/SceneViewport.tsx
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=c1135c8f7be9c3530eaeaad030a98079457ff8c0 \
            --retained-ref=refs/pull/313/head \
            --verify-path=src/tests/e2e/helpers/m7oCanvasAssertionTimingCapture.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=scripts/run-m7o-canvas-assertion-timing.mjs \
            --verify-path=scripts/normalizeM7oCanvasAssertionTimingCapture.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=817f534dc0e61068cf20c586947ea3d6b4b5b481 \
            --retained-ref=refs/pull/313/head \
            --verify-path=scripts/normalizeM7oCanvasAssertionTimingMatrix.mjs \
            --verify-path=scripts/normalizeM7oCanvasAssertionTimingCapture.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=26a856a52e7d2809727588813e65dc40684abc97 \
            --retained-ref=refs/pull/313/head \
            --verify-path=scripts/evaluateM7oCanvasAssertionTiming.ts \
            --verify-path=scripts/run-m7o-evidence.mjs \
            --verify-path=src/tests/unit/m7oCanvasAssertionTimingEvidence.test.ts

      # M7P's execution, normalizer, and evaluator sources are separately
      # pinned. Fetch from this PR's retained head when squash merge removes
      # those commits from main, and verify every declared source tree path.
      - name: Fetch M7P assertion scheduling evidence source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=3131da63a608a4591a345c3b03a072eafd1f8783 \
            --retained-ref=refs/pull/314/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/helpers/m7pAssertionSchedulingCapture.ts \
            --verify-path=scripts/run-m7p-assertion-scheduling.mjs \
            --verify-path=scripts/normalizeM7pAssertionSchedulingCapture.mjs \
            --verify-path=scripts/evaluateM7pAssertionScheduling.ts \
            --verify-path=scripts/run-m7p-evidence.mjs \
            --verify-path=src/tests/unit/m7pAssertionSchedulingEvidence.test.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=97d17110fff4c6d412e156c9281deac5a44bdb11 \
            --retained-ref=refs/pull/314/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/helpers/m7pAssertionSchedulingCapture.ts \
            --verify-path=scripts/run-m7p-assertion-scheduling.mjs \
            --verify-path=scripts/normalizeM7pAssertionSchedulingCapture.mjs \
            --verify-path=scripts/evaluateM7pAssertionScheduling.ts \
            --verify-path=scripts/run-m7p-evidence.mjs \
            --verify-path=src/tests/unit/m7pAssertionSchedulingEvidence.test.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=e9a65d31327cd1e8cd135aeae5ff444c39988e27 \
            --retained-ref=refs/pull/314/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/helpers/m7pAssertionSchedulingCapture.ts \
            --verify-path=scripts/run-m7p-assertion-scheduling.mjs \
            --verify-path=scripts/normalizeM7pAssertionSchedulingCapture.mjs \
            --verify-path=scripts/evaluateM7pAssertionScheduling.ts \
            --verify-path=scripts/run-m7p-evidence.mjs \
            --verify-path=src/tests/unit/m7pAssertionSchedulingEvidence.test.ts

      # M7Q captures were executed with this runner source. Its offline
      # normalizer/evaluator are pinned independently because a squash merge
      # may remove these original commits from main's reachable history.
      - name: Fetch M7Q matched tracing A/B evidence source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=cde9e31fb299bf436e9dd5afd6509e3409e6add1 \
            --retained-ref=refs/pull/315/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/home.spec.ts \
            --verify-path=src/tests/e2e/simulator-header.spec.ts \
            --verify-path=src/tests/e2e/smoke.spec.ts \
            --verify-path=src/tests/e2e/helpers/m7pAssertionSchedulingCapture.ts \
            --verify-path=scripts/run-m7q-light-peer-trace-ab.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=a33897808decbff0ccc7acc1a54d3e1497f5cd35 \
            --retained-ref=refs/pull/315/head \
            --verify-path=scripts/normalizeM7qLightPeerTraceAb.mjs \
            --verify-path=scripts/evaluateM7qLightPeerTraceAb.ts \
            --verify-path=scripts/run-m7q-evidence.mjs \
            --verify-path=src/tests/unit/m7qLightPeerTraceAbEvidence.test.ts

      # Schema-v2 selected evidence also names its original tooling/evaluator
      # commit. It is an ancestor of PR #309, not necessarily of squash-merged
      # main, so fetch that exact commit or its retained PR history and verify
      # both source tree entries before either M7K report is evaluated.
      - name: Fetch M7K schema-v2 tooling and evaluator source history
        run: >-
          node scripts/fetch-m7k-execution-source.mjs
          --sha=23104069bc3acb2078722979b9591b0293e4fa39
          --retained-ref=refs/pull/309/head
          --verify-path=scripts/run-m7k-broad-e2e.mjs
          --verify-path=src/render/testing/groundGlassM7kBroadE2eQualification.ts

      # M7R uses the M7Q merge source, while its original capture runner and
      # corrected analysis tools may disappear from main after this PR is
      # squash-merged. Fetch exact pinned commits from retained refs and
      # verify their source tree entries before the evidence gate runs.
      - name: Fetch M7R retained baseline and analysis source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=d34fe8b39f6c1e0509b3ffecb6fcc6566282d9f8 \
            --retained-ref=refs/pull/315/head \
            --verify-path=playwright.config.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=ccae6bdd904d654fc73b12ec5875376575c3e16b \
            --retained-ref=refs/pull/316/head \
            --verify-path=scripts/run-m7r-broad-e2e.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=92e19dd5496fd013eec8f2e9143632253f568a3e \
            --retained-ref=refs/pull/316/head \
            --verify-path=scripts/run-m7r-broad-e2e.mjs \
            --verify-path=scripts/normalizeM7rBroadE2eCapture.mjs \
            --verify-path=scripts/evaluateM7rBroadE2eRecovery.ts \
            --verify-path=scripts/run-m7r-evidence.mjs \
            --verify-path=src/tests/unit/m7rBroadE2eRecoveryEvidence.test.ts \
            --verify-path=package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for focused E2E regressions
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Run ordinary Chromium application smoke
        run: npm run test:e2e -- --project=chromium --workers=1 src/tests/e2e/smoke.spec.ts

      - name: Verify production preview WebGL isolation
        run: >-
          npm run test:e2e -- --config=playwright.production.config.ts
          --project=chromium-production-preview --workers=1
          src/tests/e2e/architecture-rise-webgpu-production.spec.ts

      - name: Replay persisted M7F presentation evidence
        run: |
          M7F_REPLAY_REPORT="$GITHUB_WORKSPACE/.m7f-presentation-replay.json"
          trap 'rm -f "$M7F_REPLAY_REPORT"' EXIT
          npm run evidence:replay:m7f -- --report-output="$M7F_REPLAY_REPORT"

      - name: Validate M7G consolidated evidence integrity
        run: |
          M7G_REPORT="$GITHUB_WORKSPACE/.m7g-consolidation-report.json"
          M7G_EVALUATION="$GITHUB_WORKSPACE/.m7g-consolidation-evaluation.json"
          trap 'rm -f "$M7G_REPORT" "$M7G_EVALUATION"' EXIT
          npm run evidence:report:m7g -- --report-output="$M7G_REPORT" --evaluation-output="$M7G_EVALUATION"

      - name: Validate M7H historical broad E2E triage integrity
        run: npm run evidence:check:m7h

      - name: Validate M7I broad E2E remediation evidence integrity
        run: npm run evidence:check:m7i

      - name: Validate M7J four-worker stability evidence integrity
        run: npm run evidence:check:m7j

      - name: Validate M7K accepted schema-v1 full-suite evidence integrity
        run: npm run evidence:check:m7k

      - name: Validate M7K schema-v2 selected evidence integrity
        run: >-
          npm run evidence:check:m7k --
          --report-path=docs/architecture/ground-glass-m7k-broad-e2e/review-fix-r1/selected/qualification-report.json

      - name: Validate M7L Learning Drawer remediation evidence integrity
        run: npm run evidence:check:m7l

      - name: Validate M7M Scene / Ground Glass readiness evidence integrity
        run: npm run evidence:check:m7m

      - name: Validate M7N renderer lifecycle evidence integrity
        run: npm run evidence:check:m7n

      - name: Validate M7O Canvas assertion timing evidence integrity
        run: npm run evidence:check:m7o

      - name: Validate M7P assertion scheduling evidence integrity
        run: npm run evidence:check:m7p

      - name: Validate M7Q matched light-peer tracing A/B evidence integrity
        run: npm run evidence:check:m7q

      - name: Validate M7R broad E2E recovery evidence integrity
        run: npm run evidence:check:m7r

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: |
          npm run build -- --base="/${{ github.event.repository.name }}/"
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
