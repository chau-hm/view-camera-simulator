name: CI and Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.ref) || format('manual-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/production' && 'feature-push-validation' || 'ci' }}
    needs:
      - feature-push-routing
      - feature-push-validation-gate
      - historical-qualification
    if: >-
      always() &&
      !(needs.feature-push-routing.result == 'success' &&
        (needs.feature-push-routing.outputs.decision == 'covered-by-pr' ||
         needs.feature-push-routing.outputs.decision == 'no-commit'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Require successful historical qualification and fail-open routing
        env:
          FEATURE_ROUTING_RESULT: ${{ needs.feature-push-routing.result }}
          FEATURE_ROUTING_DECISION: ${{ needs.feature-push-routing.outputs.decision }}
          FEATURE_GATE_RESULT: ${{ needs.feature-push-validation-gate.result }}
          HISTORICAL_RESULT: ${{ needs.historical-qualification.result }}
          HISTORICAL_DECISION: ${{ needs.historical-qualification.outputs.decision }}
          HISTORICAL_MODE: ${{ needs.historical-qualification.outputs.mode }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/historical-qualification-ci-gate.mjs

      # Dedicated M7E–M7Q and M7W evidence commands run in the change-triggered
      # archive lane. Keep source history required by provenance tests inside
      # full Vitest, and retain the M7R/M7V ordinary evidence owners.
      - name: Fetch M7F native capture source history
        run: git fetch --no-tags --depth=50 origin refs/pull/304/head

      - name: Fetch M7K execution source history
        run: node scripts/fetch-m7k-execution-source.mjs --sha=e6066a244510387c32995c1e973a771667b04d10

      - name: Fetch M7M scene-readiness execution source history
        run: >-
          node scripts/fetch-m7k-execution-source.mjs
          --sha=0c32f113c1e3d16a8fd42e7748c64909366c6ae8
          --verify-path=playwright.config.ts

      - name: Fetch M7M retained normalizer and evaluator source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=e6c139ef60974a544f75a45d062b92101d31d115 \
            --retained-ref=refs/pull/311/head \
            --verify-path=scripts/normalize-m7m-playwright-capture.mjs \
            --verify-path=src/render/testing/groundGlassM7mSceneReadiness.ts \
            --verify-path=scripts/evaluateM7mSceneReadiness.ts \
            --verify-path=scripts/run-m7m-scene-readiness.mjs
          git update-ref refs/m7m/retained-tooling e6c139ef60974a544f75a45d062b92101d31d115
          git cat-file -e 'e6c139ef60974a544f75a45d062b92101d31d115^{commit}'

      - name: Fetch M7N renderer lifecycle evidence source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=5034edf1551466649623a920024057b57f8dddbf \
            --retained-ref=refs/pull/312/head \
            --verify-path=src/app/pages.tsx \
            --verify-path=src/components/layout/SimulatorWorkspace.tsx \
            --verify-path=src/components/simulator/SceneViewport.tsx \
            --verify-path=src/components/simulator/useObserverRendererLifecycle.ts \
            --verify-path=src/render/GroundGlassRenderHost.tsx \
            --verify-path=src/render/SceneRenderer.tsx \
            --verify-path=src/render/testing/m7nRendererLifecycleTrace.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=3ec85599c3cd28019126ce00cff6115c1bcdf059 \
            --retained-ref=refs/pull/312/head \
            --verify-path=src/tests/e2e/helpers/m7nRendererLifecycleCapture.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/architecture-rise-webgpu-production.spec.ts \
            --verify-path=scripts/m7n-spa-generation-probe.mjs \
            --verify-path=package.json \
            --verify-path=src/tests/unit/m7nRendererLifecycleTrace.test.ts \
            --verify-path=src/tests/unit/m7nRendererLifecycleEvidence.test.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=a5fbc9e6b7db00ce818edfaebeeb5ce4ab79da07 \
            --retained-ref=refs/pull/312/head \
            --verify-path=src/tests/e2e/helpers/m7nRendererLifecycleCapture.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=efdd29ddcea206b07a2dbd197ff813ccfb2479b1 \
            --retained-ref=refs/pull/312/head \
            --verify-path=scripts/normalizeM7nRendererLifecycleCapture.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=ef79ee9886dacc0a1402fd9271318564e7ccfae6 \
            --retained-ref=refs/pull/312/head \
            --verify-path=scripts/evaluateM7nRendererLifecycle.ts \
            --verify-path=scripts/run-m7n-renderer-lifecycle.mjs

      - name: Fetch M7O Canvas assertion timing evidence source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=e5150fdaa6d9660c99ac3c36086cfaa1439e4bcb \
            --retained-ref=refs/pull/313/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/components/simulator/SceneViewport.tsx
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=c1135c8f7be9c3530eaeaad030a98079457ff8c0 \
            --retained-ref=refs/pull/313/head \
            --verify-path=src/tests/e2e/helpers/m7oCanvasAssertionTimingCapture.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=scripts/run-m7o-canvas-assertion-timing.mjs \
            --verify-path=scripts/normalizeM7oCanvasAssertionTimingCapture.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=817f534dc0e61068cf20c586947ea3d6b4b5b481 \
            --retained-ref=refs/pull/313/head \
            --verify-path=scripts/normalizeM7oCanvasAssertionTimingMatrix.mjs \
            --verify-path=scripts/normalizeM7oCanvasAssertionTimingCapture.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=26a856a52e7d2809727588813e65dc40684abc97 \
            --retained-ref=refs/pull/313/head \
            --verify-path=scripts/evaluateM7oCanvasAssertionTiming.ts \
            --verify-path=scripts/run-m7o-evidence.mjs \
            --verify-path=src/tests/unit/m7oCanvasAssertionTimingEvidence.test.ts

      - name: Fetch M7P assertion scheduling evidence source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=3131da63a608a4591a345c3b03a072eafd1f8783 \
            --retained-ref=refs/pull/314/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/helpers/m7pAssertionSchedulingCapture.ts \
            --verify-path=scripts/run-m7p-assertion-scheduling.mjs \
            --verify-path=scripts/normalizeM7pAssertionSchedulingCapture.mjs \
            --verify-path=scripts/evaluateM7pAssertionScheduling.ts \
            --verify-path=scripts/run-m7p-evidence.mjs \
            --verify-path=src/tests/unit/m7pAssertionSchedulingEvidence.test.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=97d17110fff4c6d412e156c9281deac5a44bdb11 \
            --retained-ref=refs/pull/314/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/helpers/m7pAssertionSchedulingCapture.ts \
            --verify-path=scripts/run-m7p-assertion-scheduling.mjs \
            --verify-path=scripts/normalizeM7pAssertionSchedulingCapture.mjs \
            --verify-path=scripts/evaluateM7pAssertionScheduling.ts \
            --verify-path=scripts/run-m7p-evidence.mjs \
            --verify-path=src/tests/unit/m7pAssertionSchedulingEvidence.test.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=e9a65d31327cd1e8cd135aeae5ff444c39988e27 \
            --retained-ref=refs/pull/314/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/helpers/m7pAssertionSchedulingCapture.ts \
            --verify-path=scripts/run-m7p-assertion-scheduling.mjs \
            --verify-path=scripts/normalizeM7pAssertionSchedulingCapture.mjs \
            --verify-path=scripts/evaluateM7pAssertionScheduling.ts \
            --verify-path=scripts/run-m7p-evidence.mjs \
            --verify-path=src/tests/unit/m7pAssertionSchedulingEvidence.test.ts

      - name: Fetch M7Q matched tracing A/B evidence source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=cde9e31fb299bf436e9dd5afd6509e3409e6add1 \
            --retained-ref=refs/pull/315/head \
            --verify-path=playwright.config.ts \
            --verify-path=src/tests/e2e/architecture-rise-focus-range.spec.ts \
            --verify-path=src/tests/e2e/home.spec.ts \
            --verify-path=src/tests/e2e/simulator-header.spec.ts \
            --verify-path=src/tests/e2e/smoke.spec.ts \
            --verify-path=src/tests/e2e/helpers/m7pAssertionSchedulingCapture.ts \
            --verify-path=scripts/run-m7q-light-peer-trace-ab.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=a33897808decbff0ccc7acc1a54d3e1497f5cd35 \
            --retained-ref=refs/pull/315/head \
            --verify-path=scripts/normalizeM7qLightPeerTraceAb.mjs \
            --verify-path=scripts/evaluateM7qLightPeerTraceAb.ts \
            --verify-path=scripts/run-m7q-evidence.mjs \
            --verify-path=src/tests/unit/m7qLightPeerTraceAbEvidence.test.ts

      # M7R uses the M7Q merge source, while its original capture runner and
      # corrected analysis tools may disappear from main after this PR is
      # squash-merged. Fetch exact pinned commits from retained refs and
      # verify their source tree entries before the evidence gate runs.
      - name: Fetch M7R retained baseline and analysis source history
        run: |
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=d34fe8b39f6c1e0509b3ffecb6fcc6566282d9f8 \
            --retained-ref=refs/pull/315/head \
            --verify-path=playwright.config.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=ccae6bdd904d654fc73b12ec5875376575c3e16b \
            --retained-ref=refs/pull/316/head \
            --verify-path=scripts/run-m7r-broad-e2e.mjs
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=df5bc305cb29be16c2ac7e0004ab4d56447cb924 \
            --retained-ref=refs/pull/316/head \
            --verify-path=scripts/run-m7r-broad-e2e.mjs \
            --verify-path=scripts/normalizeM7rBroadE2eCapture.mjs \
            --verify-path=scripts/evaluateM7rBroadE2eRecovery.ts \
            --verify-path=scripts/run-m7r-evidence.mjs \
            --verify-path=src/tests/unit/m7rBroadE2eRecoveryEvidence.test.ts
          node scripts/fetch-m7k-execution-source.mjs \
            --sha=a731929ae377d5ff0d991179f6dcc5d34c318d26 \
            --retained-ref=refs/pull/316/head \
            --verify-path=package.json

      - name: Fetch M7V reviewed source-declaration baseline
        run: >-
          node scripts/fetch-m7k-execution-source.mjs
          --sha=6e236d2ef4f248bfd3ad081d8d1786a7c0f8f382
          --verify-path=src/tests/e2e/smoke.spec.ts
          --verify-path=src/tests/e2e/ground-glass-webgpu-failure-host.spec.ts
          --verify-path=src/tests/e2e/observer-environment-compatibility.spec.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for focused E2E regressions
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Run ordinary Chromium application smoke
        run: npm run test:e2e -- --project=chromium --workers=1 src/tests/e2e/smoke.spec.ts

      - name: Verify production preview WebGL isolation
        env:
          VCS_PREVIEW_TYPECHECK_PASSED: "1"
        run: >-
          npm run test:e2e -- --config=playwright.production.config.ts
          --project=chromium-production-preview --workers=1
          src/tests/e2e/architecture-rise-webgpu-production.spec.ts

      - name: Validate M7R broad E2E recovery evidence integrity
        run: npm run evidence:check:m7r

      - name: Validate M7V E2E qualification lane and skip governance policy
        run: npm run evidence:check:m7v

      - name: Build and identify candidate
        if: github.repository == 'chau-hm/view-camera-simulator' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.after == github.sha
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && node scripts/pages-artifact.mjs prepare-after-typecheck "$RUNNER_TEMP/pages-artifact"
      - name: Pin original identity outside the candidate
        if: github.repository == 'chau-hm/view-camera-simulator' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.after == github.sha
        run: node scripts/pages-artifact.mjs pin "$RUNNER_TEMP/pages-artifact" "$RUNNER_TEMP/pages-identity.json" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})"
      - name: Test prebuilt candidate
        if: github.repository == 'chau-hm/view-camera-simulator' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.after == github.sha
        env:
          VCS_PAGES_ARTIFACT: ${{ runner.temp }}/pages-artifact/payload
        run: >-
          npm run test:e2e -- --config=playwright.pages-artifact.config.ts
          --project=chromium-pages-artifact --workers=1
      - name: Verify unchanged payload
        if: github.repository == 'chau-hm/view-camera-simulator' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.after == github.sha
        run: |
          node scripts/pages-artifact.mjs verify-pinned "$RUNNER_TEMP/pages-artifact" "$RUNNER_TEMP/pages-identity.json" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/verified.json"
          node -e 'const fs = require("node:fs"); const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/verified.json")); fs.writeFileSync(process.env.RUNNER_TEMP + "/pages-artifact/validation.json", JSON.stringify({ status: "ARTIFACT_VALIDATED", qualification: "RELEASE_QUALIFICATION_PENDING", deployment: "NOT_DEPLOYED", ...result }, null, 2) + "\n");'
      - name: Retain candidate and identity
        if: github.repository == 'chau-hm/view-camera-simulator' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.after == github.sha
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pages-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-artifact
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Retrieve retained candidate into a fresh directory
        if: github.repository == 'chau-hm/view-camera-simulator' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.after == github.sha
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pages-retained
      - name: Verify retained candidate
        if: github.repository == 'chau-hm/view-camera-simulator' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted == false && github.event.after == github.sha
        run: |
          node scripts/pages-artifact.mjs verify-pinned "$RUNNER_TEMP/pages-retained" "$RUNNER_TEMP/pages-identity.json" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" --retained
          echo "ARTIFACT_RETENTION_VERIFIED; RELEASE_QUALIFICATION_PENDING; NOT_DEPLOYED" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: |
          npm run build -- --base="/${{ github.event.repository.name }}/"
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  feature-push-routing:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.deleted.outputs.decision || steps.not_feature_push.outputs.decision || steps.route.outputs.decision || 'run-ci' }}
      reason: ${{ steps.deleted.outputs.reason || steps.not_feature_push.outputs.reason || steps.route.outputs.reason || 'routing-unavailable' }}
    steps:
      - name: Recognize branch deletion
        id: deleted
        if: >-
          github.event_name == 'push' &&
          github.ref != 'refs/heads/main' &&
          github.ref != 'refs/heads/production' &&
          (github.event.deleted == true || github.event.after == '0000000000000000000000000000000000000000')
        run: |
          echo "decision=no-commit" >> "$GITHUB_OUTPUT"
          echo "reason=branch-deleted" >> "$GITHUB_OUTPUT"

      - name: Allow full CI for non-feature-push events
        id: not_feature_push
        if: github.event_name != 'push' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
        run: |
          echo "decision=run-ci" >> "$GITHUB_OUTPUT"
          echo "reason=not-feature-push" >> "$GITHUB_OUTPUT"

      - name: Checkout routing helper
        if: >-
          github.event_name == 'push' &&
          github.ref != 'refs/heads/main' &&
          github.ref != 'refs/heads/production' &&
          steps.deleted.outputs.decision != 'no-commit'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js for routing helper
        if: >-
          github.event_name == 'push' &&
          github.ref != 'refs/heads/main' &&
          github.ref != 'refs/heads/production' &&
          steps.deleted.outputs.decision != 'no-commit'
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 24

      - name: Classify feature push against current PR validation
        id: route
        if: >-
          github.event_name == 'push' &&
          github.ref != 'refs/heads/main' &&
          github.ref != 'refs/heads/production' &&
          steps.deleted.outputs.decision != 'no-commit'
        run: node --experimental-strip-types scripts/feature-push-routing.ts
        continue-on-error: true
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}

  feature-push-validation-gate:
    needs: feature-push-routing
    if: >-
      !cancelled() &&
      !(needs.feature-push-routing.result == 'success' &&
        (needs.feature-push-routing.outputs.decision == 'covered-by-pr' ||
         needs.feature-push-routing.outputs.decision == 'no-commit'))
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Allow full CI unless exact PR validation covers this push
        run: echo "Full CI is required for this event."
  historical-qualification:
    needs: feature-push-routing
    if: >-
      always() &&
      !cancelled() &&
      !(needs.feature-push-routing.result == 'success' &&
        (needs.feature-push-routing.outputs.decision == 'covered-by-pr' ||
         needs.feature-push-routing.outputs.decision == 'no-commit'))
    uses: ./.github/workflows/historical-qualification.yml
    with:
      mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' && 'production-release' || 'changed' }}
    permissions:
      contents: read
      pull-requests: read
